databases:
  - name: clutch-moment-sports-db
    plan: free
    databaseName: clutch_moment_sports
    user: clutch_moment_sports

services:
  - type: web
    name: clutch-moment-sports-web
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn mywebsite.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: clutch-moment-sports-db
          property: connectionString
      - key: DISCORD_WEBHOOK_URL
        sync: false

  - type: worker
    name: clutch-moment-sports-poller
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py poll_scores --loop --interval 60"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: clutch-moment-sports-db
          property: connectionString
      - key: DISCORD_WEBHOOK_URL
        sync: false
