<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Premier League Live Scores</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: #0f1115;
            color: #e8e8e8;
            margin: 0;
            padding: 1.5rem;
        }
        h1 { font-size: 1.5rem; margin: 0 0 1.5rem; }

        .status-group { max-width: 960px; margin: 0 auto 2rem; }
        .group-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #9aa1ac;
            margin: 0 0 0.75rem;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 0.75rem;
        }

        .game {
            position: relative;
            background: #1a1d24;
            border: 1px solid #2a2e38;
            border-radius: 8px;
            padding: 1rem;
        }
        .game.clutch { border-color: #e0a52c; box-shadow: 0 0 0 1px #e0a52c inset; }

        .teams { display: flex; align-items: center; justify-content: space-between; font-weight: 600; gap: 0.5rem; }
        .team { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .score { font-variant-numeric: tabular-nums; padding: 0 0.75rem; flex-shrink: 0; }

        .penalties { font-size: 0.75rem; color: #9aa1ac; margin-top: 0.35rem; }

        .meta { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.6rem; font-size: 0.8rem; color: #9aa1ac; flex-wrap: wrap; }
        .status-in { color: #4caf50; font-weight: 600; }
        .status-post { color: #6b7280; }

        .et-badge {
            background: #2a2e38;
            color: #c9cdd4;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
        }

        .clutch-badge {
            position: absolute;
            top: -0.6rem;
            right: 0.75rem;
            background: #e0a52c;
            color: #1a1300;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            box-shadow: 0 0 0 rgba(76, 175, 80, 0.6);
            animation: pulse 1.6s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.6); }
            70% { box-shadow: 0 0 0 6px rgba(76, 175, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }

        .empty { color: #9aa1ac; text-align: center; }
        #last-updated { font-size: 0.75rem; color: #6b7280; margin-top: 1.5rem; text-align: center; }
    </style>
</head>
<body>
    <h1>Premier League Live Scores</h1>
    <div id="games">{% include "games/_games_list.html" %}</div>
    <div id="last-updated"></div>

    <script>
        const REFRESH_MS = 15000;

        async function refresh() {
            try {
                const response = await fetch("{% url 'games_partial' %}");
                if (!response.ok) return;
                document.getElementById("games").innerHTML = await response.text();
                document.getElementById("last-updated").textContent =
                    "Last updated " + new Date().toLocaleTimeString();
            } catch (err) {
                // silently skip a failed refresh; next interval will retry
            }
        }

        setInterval(refresh, REFRESH_MS);
    </script>
</body>
</html>
