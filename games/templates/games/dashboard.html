<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Premier League Live Scores</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f1115; color: #e8e8e8; margin: 0; padding: 2rem; }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
        #games { display: grid; gap: 0.75rem; max-width: 640px; }
        .game { background: #1a1d24; border: 1px solid #2a2e38; border-radius: 8px; padding: 1rem; }
        .game.clutch { border-color: #e0a52c; box-shadow: 0 0 0 1px #e0a52c inset; }
        .teams { display: flex; align-items: center; justify-content: space-between; font-weight: 600; }
        .score { font-variant-numeric: tabular-nums; padding: 0 0.75rem; }
        .meta { display: flex; gap: 0.75rem; margin-top: 0.5rem; font-size: 0.8rem; color: #9aa1ac; }
        .status-in { color: #4caf50; font-weight: 600; }
        .clutch-badge { color: #e0a52c; font-weight: 600; }
        .empty { color: #9aa1ac; }
        #last-updated { font-size: 0.75rem; color: #6b7280; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <h1>Premier League Live Scores</h1>
    <div id="games">{% include "games/_games_list.html" %}</div>
    <div id="last-updated"></div>

    <script>
        const REFRESH_MS = 15000;

        async function refresh() {
            try {
                const response = await fetch("{% url 'games_partial' %}");
                if (!response.ok) return;
                document.getElementById("games").innerHTML = await response.text();
                document.getElementById("last-updated").textContent =
                    "Last updated " + new Date().toLocaleTimeString();
            } catch (err) {
                // silently skip a failed refresh; next interval will retry
            }
        }

        setInterval(refresh, REFRESH_MS);
    </script>
</body>
</html>
